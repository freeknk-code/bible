<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>성경 음성 검색</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="성경">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      color: #f0a500;
      letter-spacing: 0.05em;
    }

    .search-bar {
      padding: 12px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #textInput {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
    }

    #textInput:focus { border-color: #f0a500; }
    #textInput::placeholder { color: #484f58; }

    #micBtn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f0a500;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #micBtn.listening {
      background: #e05c5c;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    #searchBtn {
      height: 48px;
      padding: 0 16px;
      border-radius: 8px;
      background: #238636;
      border: none;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .status-bar {
      padding: 8px 16px;
      font-size: 0.82rem;
      color: #8b949e;
      background: #0d1117;
      min-height: 30px;
      text-align: center;
    }

    .status-bar.error { color: #f85149; }
    .status-bar.success { color: #3fb950; }

    .verses-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 80px 0;
    }

    .chapter-header {
      position: sticky;
      top: 0;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #f0a500;
      z-index: 10;
    }

    .verse-block {
      padding: 10px 16px;
      line-height: 1.85;
      font-size: 1rem;
      border-bottom: 1px solid #1c2128;
    }

    .verse-block.highlight {
      background: rgba(240, 165, 0, 0.08);
      border-left: 3px solid #f0a500;
    }

    .verse-num {
      color: #f0a500;
      font-size: 0.78rem;
      font-weight: bold;
      margin-right: 6px;
      vertical-align: top;
      line-height: 2;
    }

    .load-more-wrap {
      text-align: center;
      padding: 20px;
    }

    #loadMoreBtn {
      display: none;
      padding: 10px 32px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 20px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #loadMoreBtn:active { background: #30363d; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #484f58;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.95rem; line-height: 1.7; }
    .empty-state small { font-size: 0.82rem; color: #30363d; }
  </style>
</head>
<body>

<header>
  <h1>📖 성경 음성 검색 (개역개정)</h1>
</header>

<div class="search-bar">
  <button id="micBtn" onclick="toggleListening()" title="음성 입력">🎤</button>
  <input id="textInput" type="text" placeholder="예: 갈라디아서 5장 1절" onkeydown="if(event.key==='Enter')searchVerse()">
  <button id="searchBtn" onclick="searchVerse()">이동</button>
</div>

<div class="status-bar" id="statusBar">성경 데이터 불러오는 중...</div>

<div class="verses-container" id="versesContainer">
  <div class="empty-state">
    <div class="icon">🎙️</div>
    <p>마이크 버튼을 누르고<br>읽고 싶은 구절을 말씀해주세요</p>
    <br>
    <small>예) "갈라디아서 5장 1절"<br>"시편 23편 1절"<br>"요한복음 3장 16절"</small>
  </div>
</div>

<div class="load-more-wrap">
  <button id="loadMoreBtn" onclick="loadMore()">▼ 더 보기</button>
</div>

<script>
  const BOOK_MAP = {
    '창세기':'창','출애굽기':'출','레위기':'레','민수기':'민','신명기':'신',
    '여호수아':'수','사사기':'삿','룻기':'룻',
    '사무엘상':'삼상','사무엘하':'삼하',
    '열왕기상':'왕상','열왕기하':'왕하',
    '역대상':'대상','역대하':'대하',
    '에스라':'스','느헤미야':'느','에스더':'에',
    '욥기':'욥','시편':'시','잠언':'잠','전도서':'전','아가':'아',
    '이사야':'사','예레미야':'렘','예레미야애가':'애','에스겔':'겔','다니엘':'단',
    '호세아':'호','요엘':'욜','아모스':'암','오바댜':'옵','요나':'욘',
    '미가':'미','나훔':'나','하박국':'합','스바냐':'습','학개':'학',
    '스가랴':'슥','말라기':'말',
    '마태복음':'마','마가복음':'막','누가복음':'눅','요한복음':'요',
    '사도행전':'행','로마서':'롬',
    '고린도전서':'고전','고린도후서':'고후',
    '갈라디아서':'갈','에베소서':'엡','빌립보서':'빌','골로새서':'골',
    '데살로니가전서':'살전','데살로니가후서':'살후',
    '디모데전서':'딤전','디모데후서':'딤후',
    '디도서':'딛','빌레몬서':'몬','히브리서':'히','야고보서':'약',
    '베드로전서':'벧전','베드로후서':'벧후',
    '요한일서':'요일','요한이서':'요이','요한삼서':'요삼',
    '유다서':'유','요한계시록':'계','계시록':'계'
  };

  const ABBREV_TO_FULL = {};
  Object.entries(BOOK_MAP).forEach(([full, abbr]) => {
    if (!ABBREV_TO_FULL[abbr]) ABBREV_TO_FULL[abbr] = full;
  });

  let bibleData = {};
  let bibleKeys = [];
  let currentStart = 0;
  let nextStart = 0;
  const PAGE_SIZE = 40;

  let isListening = false;
  let recognition = null;
  let micReady = false;

  // Pre-request mic permission so Chrome doesn't ask every time
  function ensureMicPermission(callback) {
    if (micReady) { callback(); return; }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
        micReady = true;
        callback();
      })
      .catch(() => {
        setStatus('마이크 권한이 거부됐습니다. 브라우저 설정에서 허용해주세요.', 'error');
      });
  }

  // Load bible.json
  fetch('bible.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      bibleData = data;
      bibleKeys = Object.keys(data);
      setStatus('준비됐습니다. 음성 또는 텍스트로 구절을 검색하세요.', '');
    })
    .catch(() => setStatus('bible.json을 불러오지 못했습니다.', 'error'));

  function setStatus(msg, type = '') {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  // Voice recognition
  function toggleListening() {
    if (isListening) { recognition && recognition.stop(); return; }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.', 'error'); return; }

    ensureMicPermission(startRecognition);
  }

  function startRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('micBtn').classList.add('listening');
      document.getElementById('micBtn').textContent = '⏹';
      setStatus('듣고 있습니다... 구절을 말씀해주세요');
    };

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      document.getElementById('textInput').value = transcript;
      if (e.results[e.results.length - 1].isFinal) searchVerse(transcript);
    };

    recognition.onend = () => {
      isListening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micBtn').textContent = '🎤';
    };

    recognition.onerror = (e) => {
      isListening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micBtn').textContent = '🎤';
      setStatus('음성 인식 오류: ' + e.error, 'error');
    };

    recognition.start();
  }

  function searchVerse(text) {
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;

    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다. 잠시 후 다시 시도해주세요.', 'error'); return; }

    // Match book name (longest first to avoid partial matches)
    const books = Object.keys(BOOK_MAP).sort((a, b) => b.length - a.length);
    let abbrev = null;
    for (const book of books) {
      if (text.includes(book)) { abbrev = BOOK_MAP[book]; break; }
    }

    if (!abbrev) { setStatus('"' + text + '"에서 책 이름을 찾지 못했습니다.', 'error'); return; }

    const chMatch = text.match(/(\d+)\s*[장편]/);
    const vsMatch = text.match(/(\d+)\s*절/);

    if (!chMatch || !vsMatch) { setStatus('장과 절 번호를 인식하지 못했습니다.', 'error'); return; }

    const key = abbrev + chMatch[1] + ':' + vsMatch[1];
    const idx = bibleKeys.indexOf(key);

    if (idx === -1) { setStatus('"' + key + '" 구절을 찾을 수 없습니다.', 'error'); return; }

    currentStart = idx;
    renderVerses(idx, false);
    setStatus((ABBREV_TO_FULL[abbrev] || abbrev) + ' ' + chMatch[1] + '장 ' + vsMatch[1] + '절부터 표시합니다.', 'success');
  }

  function renderVerses(startIdx, append) {
    const container = document.getElementById('versesContainer');
    if (!append) {
      container.innerHTML = '';
      container.scrollTop = 0;
    }

    const end = Math.min(startIdx + PAGE_SIZE, bibleKeys.length);
    let lastChapterKey = null;

    for (let i = startIdx; i < end; i++) {
      const key = bibleKeys[i];
      const text = bibleData[key];
      const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) continue;
      const [, abbr, ch, vs] = m;
      const ck = abbr + ch;

      if (ck !== lastChapterKey) {
        const hdr = document.createElement('div');
        hdr.className = 'chapter-header';
        hdr.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장';
        container.appendChild(hdr);
        lastChapterKey = ck;
      }

      const div = document.createElement('div');
      div.className = 'verse-block' + (i === currentStart && !append ? ' highlight' : '');

      const num = document.createElement('span');
      num.className = 'verse-num';
      num.textContent = vs;

      div.appendChild(num);
      div.appendChild(document.createTextNode(text));
      container.appendChild(div);
    }

    nextStart = end;
    document.getElementById('loadMoreBtn').style.display = end < bibleKeys.length ? 'block' : 'none';
  }

  function loadMore() {
    renderVerses(nextStart, true);
    document.getElementById('versesContainer').scrollBy({ top: 100, behavior: 'smooth' });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
