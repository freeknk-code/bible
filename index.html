<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>성경 음성 검색</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="성경">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { touch-action: pan-y; }

    html {
      height: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      text-align: center;
    }

    header {
      position: relative;
    }
    header h1 {
      font-size: 1.2rem;
      color: #f0a500;
      letter-spacing: 0.05em;
    }
    #settingsBtn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.6;
    }
    .settings-panel {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: none;
      gap: 8px;
      align-items: center;
    }
    .settings-panel.open { display: flex; }
    .settings-panel input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 0.85rem;
      padding: 8px 12px;
      outline: none;
    }
    .settings-panel input:focus { border-color: #f0a500; }
    .settings-panel button {
      background: #238636;
      border: none;
      color: white;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .ai-badge {
      display: inline-block;
      background: #8957e5;
      color: white;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .search-bar {
      padding: 12px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #textInput {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
    }

    #textInput:focus { border-color: #f0a500; }
    #textInput::placeholder { color: #484f58; }


    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .mic-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .mic-label {
      font-size: 0.65rem;
      color: #8b949e;
    }
    .mic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    #micVerseBtn { background: #1f6feb; }
    #micSearchBtn { background: #238636; }
    .mic-btn.listening {
      background: #e05c5c !important;
      animation: pulse 1s infinite;
    }

    .status-bar {
      padding: 8px 16px;
      font-size: 0.82rem;
      color: #8b949e;
      background: #0d1117;
      min-height: 30px;
      text-align: center;
    }

    .status-bar.error { color: #f85149; }
    .status-bar.success { color: #3fb950; }

    .verses-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 0 0 80px 0;
    }

    .chapter-header {
      position: sticky;
      top: 0;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #f0a500;
      z-index: 10;
    }

    .verse-block {
      padding: 10px 16px;
      line-height: 1.85;
      font-size: 1rem;
      border-bottom: 1px solid #1c2128;
    }

    .verse-block.highlight {
      background: rgba(240, 165, 0, 0.08);
      border-left: 3px solid #f0a500;
    }

    .verse-num {
      color: #f0a500;
      font-size: 0.78rem;
      font-weight: bold;
      margin-right: 6px;
      vertical-align: top;
      line-height: 2;
    }

    .load-more-wrap {
      text-align: center;
      padding: 20px;
    }

    #loadMoreBtn {
      display: none;
      padding: 10px 32px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 20px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #loadMoreBtn:active { background: #30363d; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #484f58;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.95rem; line-height: 1.7; }
    .empty-state small { font-size: 0.82rem; color: #30363d; }

    .verse-ref {
      font-size: 0.78rem;
      color: #f0a500;
      font-weight: bold;
      display: block;
      margin-bottom: 3px;
    }

    .copy-btn {
      float: right;
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 8px;
      line-height: 1.6;
    }
    .copy-btn:active { background: #30363d; }
    .copy-btn.copied { color: #3fb950; border-color: #3fb950; }

    mark {
      background: rgba(240, 165, 0, 0.3);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    .copy-bar {
      display: none;
      padding: 8px 16px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      font-size: 0.82rem;
      color: #3fb950;
      align-items: center;
      justify-content: space-between;
    }
    .copy-bar.visible { display: flex; }
    .copy-bar button {
      background: none;
      border: 1px solid #3fb950;
      color: #3fb950;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .result-count {
      padding: 6px 16px;
      font-size: 0.8rem;
      color: #8b949e;
      background: #0d1117;
      border-bottom: 1px solid #1c2128;
    }
  </style>
</head>
<body>

<header>
  <h1>📖 성경 음성 검색 (개역개정)</h1>
  <button id="settingsBtn" onclick="toggleSettings()" title="설정">⚙️</button>
</header>
<div class="settings-panel" id="settingsPanel">
  <input id="apiKeyInput" type="password" placeholder="Gemini API 키 입력 (자연어 검색용)">
  <button onclick="saveApiKey()">저장</button>
</div>

<div class="search-bar">
  <div class="mic-wrap">
    <button class="mic-btn" id="micVerseBtn" onclick="toggleListening('verse')" title="구절 음성 입력">🎤</button>
    <span class="mic-label">구절</span>
  </div>
  <input id="textInput" type="text" placeholder="갈5:1 / 갈오장일절 / 믿음 소망 사랑" onkeydown="if(event.key==='Enter')goToVerse()">
  <div class="mic-wrap">
    <button class="mic-btn" id="micSearchBtn" onclick="toggleListening('search')" title="검색 음성 입력">🎤</button>
    <span class="mic-label">검색</span>
  </div>
</div>

<div class="copy-bar" id="copyBar">
  <span id="copyCount">0절 복사됨</span>
  <button onclick="clearCopied()">초기화</button>
</div>
<div class="status-bar" id="statusBar">성경 데이터 불러오는 중...</div>

<div class="verses-container" id="versesContainer">
  <div class="empty-state">
    <div class="icon">🎙️</div>
    <p>마이크 버튼을 누르고<br>읽고 싶은 구절을 말씀해주세요</p>
    <br>
    <small>예) "갈라디아서 5장 1절"<br>"시편 23편 1절"<br>"요한복음 3장 16절"</small>
  </div>
</div>

<div class="load-more-wrap">
  <button id="loadMoreBtn" onclick="loadMore()">▼ 더 보기</button>
</div>

<script>
  const BOOK_MAP = {
    // 구약
    '창세기':'창','출애굽기':'출','레위기':'레','민수기':'민','신명기':'신',
    '여호수아':'수','사사기':'삿','룻기':'룻',
    '사무엘상':'삼상','사무엘하':'삼하',
    '열왕기상':'왕상','열왕기하':'왕하',
    '역대상':'대상','역대하':'대하',
    '에스라':'스','느헤미야':'느','에스더':'에',
    '욥기':'욥','시편':'시','잠언':'잠','전도서':'전','아가':'아',
    '이사야':'사','예레미야':'렘','예레미야애가':'애','에스겔':'겔','다니엘':'단',
    '호세아':'호','요엘':'욜','아모스':'암','오바댜':'옵','요나':'욘',
    '미가':'미','나훔':'나','하박국':'합','스바냐':'습','학개':'학',
    '스가랴':'슥','말라기':'말',
    // 신약
    '마태복음':'마','마가복음':'막','누가복음':'눅','요한복음':'요',
    '사도행전':'행','로마서':'롬',
    '고린도전서':'고전','고린도후서':'고후',
    '갈라디아서':'갈','에베소서':'엡','빌립보서':'빌','골로새서':'골',
    '데살로니가전서':'살전','데살로니가후서':'살후',
    '디모데전서':'딤전','디모데후서':'딤후',
    '디도서':'딛','빌레몬서':'몬','히브리서':'히','야고보서':'약',
    '베드로전서':'벧전','베드로후서':'벧후',
    '요한일서':'요일','요한이서':'요이','요한삼서':'요삼',
    '유다서':'유','요한계시록':'계','계시록':'계',
    // 약어
    '창':'창','출':'출','레':'레','민':'민','신':'신',
    '수':'수','삿':'삿','룻':'룻',
    '삼상':'삼상','삼하':'삼하',
    '왕상':'왕상','왕하':'왕하',
    '대상':'대상','대하':'대하',
    '스':'스','느':'느','에':'에',
    '욥':'욥','시':'시','잠':'잠','전':'전','아':'아',
    '사':'사','렘':'렘','애':'애','겔':'겔','단':'단',
    '호':'호','욜':'욜','암':'암','옵':'옵','욘':'욘',
    '미':'미','나':'나','합':'합','습':'습','학':'학',
    '슥':'슥','말':'말',
    '마':'마','막':'막','눅':'눅','요':'요',
    '행':'행','롬':'롬',
    '고전':'고전','고후':'고후',
    '갈':'갈','엡':'엡','빌':'빌','골':'골',
    '살전':'살전','살후':'살후',
    '딤전':'딤전','딤후':'딤후',
    '딛':'딛','몬':'몬','히':'히','약':'약',
    '벧전':'벧전','벧후':'벧후',
    '요일':'요일','요이':'요이','요삼':'요삼',
    '유':'유','계':'계',
    // 발음 유사 별칭
    '갈라지아서':'갈','갈라디야서':'갈',
    '필립보서':'빌','필립포서':'빌',
    '필레몬서':'몬','빌레몬':'몬',
    '골로세서':'골','골로쌔서':'골',
    '데살로니까전서':'살전','데살로니까후서':'살후',
    '데살로니카전서':'살전','데살로니카후서':'살후',
    '디모데이전서':'딤전','디모데이후서':'딤후',
    '에스켈':'겔','이스겔':'겔',
    '오바다':'옵','오바디아':'옵',
    '하바국':'합','하박꾹':'합',
    '스바니야':'습',
    '히부리서':'히','히브루서':'히',
    '야고버서':'약',
    '베드로일서':'벧전','베드로이서':'벧후',
    '요한계시':'계','계시록':'계',
    '사무엘일서':'삼상','사무엘이서':'삼하',
    '열왕기일서':'왕상','열왕기이서':'왕하',
    '역대기상':'대상','역대기하':'대하',
    '여호수와':'수','여호수아기':'수',
    '이사이야':'사','이사야서':'사',
    '예레미아':'렘','예레미야서':'렘',
    '호쎄아':'호','아모쓰':'암'
  };

  const ABBREV_TO_FULL = {};
  Object.entries(BOOK_MAP).forEach(([full, abbr]) => {
    if (!ABBREV_TO_FULL[abbr]) ABBREV_TO_FULL[abbr] = full;
  });

  let bibleData = {};
  let bibleKeys = [];
  let currentStart = 0;
  let nextStart = 0;
  const PAGE_SIZE = 40;

  let isListening = false;
  let recognition = null;
  let micReady = false;
  let copiedVerses = [];

  function updateCopyBar() {
    const bar = document.getElementById('copyBar');
    const count = document.getElementById('copyCount');
    if (copiedVerses.length === 0) {
      bar.classList.remove('visible');
    } else {
      bar.classList.add('visible');
      count.textContent = copiedVerses.length + '절 복사됨';
    }
  }

  function clearCopied() {
    copiedVerses = [];
    document.querySelectorAll('.copy-btn.copied').forEach(btn => {
      btn.textContent = '복사';
      btn.classList.remove('copied');
    });
    updateCopyBar();
  }

  // Pre-request mic permission so Chrome doesn't ask every time
  function ensureMicPermission(callback) {
    if (micReady) { callback(); return; }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
        micReady = true;
        callback();
      })
      .catch(() => {
        setStatus('마이크 권한이 거부됐습니다. 브라우저 설정에서 허용해주세요.', 'error');
      });
  }

  // Load bible.json
  fetch('bible.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      bibleData = data;
      bibleKeys = Object.keys(data);
      setStatus('준비됐습니다. 음성 또는 텍스트로 구절을 검색하세요.', '');
    })
    .catch(() => setStatus('bible.json을 불러오지 못했습니다.', 'error'));

  function setStatus(msg, type = '') {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  let listenMode = 'verse';

  function toggleListening(mode) {
    if (isListening) { recognition && recognition.stop(); return; }
    listenMode = mode;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.', 'error'); return; }
    ensureMicPermission(startRecognition);
  }

  function activeMicBtn() {
    return document.getElementById(listenMode === 'verse' ? 'micVerseBtn' : 'micSearchBtn');
  }

  function startRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      activeMicBtn().classList.add('listening');
      activeMicBtn().textContent = '⏹';
      setStatus(listenMode === 'verse' ? '듣고 있습니다... 구절을 말씀해주세요' : '듣고 있습니다... 검색어를 말씀해주세요');
    };

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      document.getElementById('textInput').value = transcript;
      if (e.results[e.results.length - 1].isFinal) {
        if (listenMode === 'verse') goToVerse(transcript);
        else searchBible(transcript);
      }
    };

    recognition.onend = () => {
      isListening = false;
      activeMicBtn().classList.remove('listening');
      activeMicBtn().textContent = '🎤';
    };

    recognition.onerror = (e) => {
      isListening = false;
      activeMicBtn().classList.remove('listening');
      activeMicBtn().textContent = '🎤';
      setStatus('음성 인식 오류: ' + e.error, 'error');
    };

    recognition.start();
  }

  function levenshtein(a, b) {
    const dp = Array.from({length: a.length + 1}, (_, i) =>
      Array.from({length: b.length + 1}, (_, j) => i === 0 ? j : j === 0 ? i : 0)
    );
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[a.length][b.length];
  }

  function findBook(text) {
    const books = Object.keys(BOOK_MAP).sort((a, b) => b.length - a.length);

    // 0차: 첫 단어가 BOOK_MAP에 있으면 바로 반환 (한 글자 약어 포함)
    const firstWord = text.match(/^([가-힣]+)/);
    if (firstWord && BOOK_MAP[firstWord[1]]) {
      return { abbrev: BOOK_MAP[firstWord[1]], matched: firstWord[1], fuzzy: false };
    }

    // 1차: 완전 포함 매칭
    for (const book of books) {
      if (text.includes(book)) return { abbrev: BOOK_MAP[book], matched: book, fuzzy: false };
    }

    // 2차: 숫자·장·절 제거 후 남은 텍스트로 유사도 비교
    const stripped = text.replace(/\d+\s*[장편절]/g, '').replace(/\s+/g, '').trim();
    if (!stripped) return null;

    let best = null, bestDist = Infinity;
    for (const book of books) {
      // 앞부분 부분 비교 (긴 책 이름은 앞 글자만 말해도 매칭)
      const sub = book.slice(0, stripped.length);
      const dist = Math.min(levenshtein(stripped, book), levenshtein(stripped, sub));
      if (dist < bestDist) { bestDist = dist; best = book; }
    }

    // 거리 허용 범위: 입력 길이의 40% 이하
    const threshold = Math.max(1, Math.floor(stripped.length * 0.4));
    if (bestDist <= threshold) return { abbrev: BOOK_MAP[best], matched: best, fuzzy: true };
    return null;
  }

  const KO_SUFFIXES = [
    '에서부터','으로부터','에게서','으로서','로부터','한테서',
    '에서','에게','한테','으로','로서','부터','까지','마다','조차',
    '이라도','이나마','와의','과의','이랑','랑','이라','라',
    '에도','의','와','과','에','도','만','은','는','이','가','을','를',
    '하시니라','하시니','하셨다','하였다','하였으며','하였고','하였으니',
    '하는','하고','하여','하며','하지','하면','하니','하다','하여서',
    '되시는','되는','되고','되며','됩니다','되었','됐','된',
    '있는','없는','있고','없고','이시는','이신','하신','하실',
    '스럽','다운','스러운','이다','이고','이며','인데','이면',
    '는다','는지','인지','시니라','니라'
  ];

  function koreanStem(word) {
    for (const s of KO_SUFFIXES) {
      if (word.endsWith(s) && word.length - s.length >= 1) {
        return word.slice(0, word.length - s.length);
      }
    }
    return word;
  }

  function highlightWords(text, words) {
    let result = text;
    words.forEach(w => {
      if (!w) return;
      result = result.split(w).join('<mark>' + w + '</mark>');
    });
    return result;
  }

  function makeCopyBtn(key, verseText) {
    const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
    if (!m) return document.createElement('span');
    const [, abbr, ch, vs] = m;
    const ref = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장 ' + vs + '절';
    const entry = ref + '\n' + verseText.trim();
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '복사';
    btn.onclick = (e) => {
      e.stopPropagation();
      if (btn.classList.contains('copied')) {
        // 이미 추가된 경우 제거
        copiedVerses = copiedVerses.filter(v => v !== entry);
        btn.textContent = '복사';
        btn.classList.remove('copied');
      } else {
        copiedVerses.push(entry);
        btn.textContent = '✓';
        btn.classList.add('copied');
      }
      navigator.clipboard.writeText(copiedVerses.join('\n\n'));
      updateCopyBar();
    };
    return btn;
  }

  function searchKeyword(words, isAI = false) {
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }
    setStatus('검색 중...');

    setTimeout(() => {
      // 조사/어미 제거 후 빈 문자열 제거
      const stems = words.map(koreanStem).filter(w => w.length >= 1);
      if (!stems.length) { setStatus('검색어를 인식하지 못했습니다.', 'error'); return; }

      const results = bibleKeys.filter(key =>
        stems.every(w => bibleData[key].includes(w))
      );

      if (!results.length) {
        setStatus('"' + stems.join(' ') + '" 포함된 구절이 없습니다.', 'error');
        document.getElementById('versesContainer').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>검색 결과가 없습니다</p></div>';
        return;
      }

      const container = document.getElementById('versesContainer');
      container.innerHTML = '';
      container.scrollTop = 0;

      const countDiv = document.createElement('div');
      countDiv.className = 'result-count';
      countDiv.textContent = results.length + '개 구절 발견';
      container.appendChild(countDiv);

      results.forEach(key => {
        const verseText = bibleData[key];
        const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
        if (!m) return;
        const [, abbr, ch, vs] = m;

        const div = document.createElement('div');
        div.className = 'verse-block';

        const copyBtn = makeCopyBtn(key, verseText);
        div.appendChild(copyBtn);

        const ref = document.createElement('span');
        ref.className = 'verse-ref';
        ref.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장 ' + vs + '절';
        div.appendChild(ref);

        const content = document.createElement('span');
        content.innerHTML = highlightWords(verseText, stems);
        div.appendChild(content);

        container.appendChild(div);
      });

      document.getElementById('loadMoreBtn').style.display = 'none';
      const badge = isAI ? ' <span class="ai-badge">AI</span>' : '';
      setStatus(results.length + '개 구절을 찾았습니다.' + badge, 'success');
    }, 10);
  }

  function koToNum(s) {
    if (/^\d+$/.test(s)) return parseInt(s);
    const koNum = { '일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9 };
    let n = 0;
    if (s.includes('백')) {
      const i = s.indexOf('백');
      n += (koNum[s.slice(0, i)] || 1) * 100;
      s = s.slice(i + 1);
    }
    if (s.includes('십')) {
      const i = s.indexOf('십');
      const t = s.slice(0, i);
      n += (t ? (koNum[t] || 1) : 1) * 10;
      s = s.slice(i + 1);
    }
    if (s && koNum[s] !== undefined) n += koNum[s];
    return n || 0;
  }

  function convertKoreanNumbers(text) {
    const hasJang = /[일이삼사오육칠팔구백십\d]+\s*[장편]/.test(text);
    const hasJeol = /[일이삼사오육칠팔구백십\d]+\s*절/.test(text);
    if (!hasJang || !hasJeol) return text;

    return text.replace(/([일이삼사오육칠팔구백십]+)\s*([장편절])/g, (match, num, suffix) => {
      const n = koToNum(num);
      return n > 0 ? n + suffix : match;
    });
  }

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      const saved = localStorage.getItem('geminiKey') || '';
      document.getElementById('apiKeyInput').value = saved ? '●'.repeat(8) : '';
    }
  }

  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val && !val.startsWith('●')) {
      localStorage.setItem('geminiKey', val);
    }
    document.getElementById('settingsPanel').classList.remove('open');
    const has = !!localStorage.getItem('geminiKey');
    setStatus(has ? 'API 키 저장됨. 자연어 검색 사용 가능!' : 'API 키가 없습니다.', has ? 'success' : '');
  }

  async function searchWithGemini(query) {
    const key = localStorage.getItem('geminiKey');
    if (!key) return null;
    const prompt = `성경 검색 요청을 분석해서 JSON으로만 응답하세요 (설명 없이).
검색어: "${query}"
{
  "keywords": [],     // 성경에서 찾을 핵심 단어들 (조사 제거, 2자 이상)
  "book": null,       // 특정 책 약어(창/출/갈/요 등), 없으면 null
  "chapter": null,    // 장 번호(숫자), 없으면 null
  "verse": null       // 절 번호(숫자), 없으면 null
}`;
    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        }
      );
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (err.error?.code === 429) setStatus('API 한도 초과. 잠시 후 다시 시도하세요.', 'error');
        else setStatus('Gemini 오류: ' + (err.error?.message || res.status), 'error');
        return null;
      }
      const data = await res.json();
      const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const m = txt.match(/\{[\s\S]*\}/);
      if (!m) return null;
      return JSON.parse(m[0]);
    } catch (e) {
      setStatus('네트워크 오류 또는 API 키를 확인하세요.', 'error');
      return null;
    }
  }

  function tryVerseKey(bookResult, ch, vs) {
    if (!bookResult || ch <= 0 || vs <= 0) return -1;
    return bibleKeys.indexOf(bookResult.abbrev + ch + ':' + vs);
  }

  function goToVerse(text) {
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }

    text = convertKoreanNumbers(text);
    document.getElementById('textInput').value = text;

    // 1. 장/절 형식: "갈 5장 1절" / 장만 있으면 1절 기본값
    const hasJang = /[일이삼사오육칠팔구백십\d]+\s*[장편]/.test(text);
    if (hasJang) {
      text = text.replace(/([일이삼사오육칠팔구백십]+)\s*([장편절])/g, (m, num, suf) => {
        const n = koToNum(num); return n > 0 ? n + suf : m;
      });
      document.getElementById('textInput').value = text;
      const bookResult = findBook(text);
      if (bookResult) {
        const chM = text.match(/(\d+)\s*[장편]/);
        const vsM = text.match(/(\d+)\s*절/);
        if (chM) {
          const vs = vsM ? parseInt(vsM[1]) : 1;
          const idx = tryVerseKey(bookResult, parseInt(chM[1]), vs);
          if (idx !== -1) { showVerse(idx, bookResult, chM[1], vs); return; }
        }
      }
    }

    // 2. 단축 형식: "갈 5 1" / "갈5:1" / "갈 오 일"
    const koN = '[일이삼사오육칠팔구백십\\d]+';
    const shortRef = text.match(new RegExp('^([가-힣]+)\\s*(' + koN + ')[:\\s]\\s*(' + koN + ')$'));
    if (shortRef) {
      const bookResult = findBook(shortRef[1]);
      const ch = koToNum(shortRef[2]), vs = koToNum(shortRef[3]);
      const idx = tryVerseKey(bookResult, ch, vs);
      if (idx !== -1) { showVerse(idx, bookResult, ch, vs); return; }
    }

    // 3. 붙여쓰기: "창일일" / "갈오일"
    const koNums = '일이삼사오육칠팔구십백';
    const stuck = text.match(new RegExp('^([가-힣]+?)\\s*([' + koNums + '\\d]+)$'));
    if (stuck && /[일이삼사오육칠팔구십백]/.test(stuck[2])) {
      const bookResult = findBook(stuck[1]);
      if (bookResult) {
        const numStr = stuck[2];
        for (let i = numStr.length - 1; i >= 1; i--) {
          const ch = koToNum(numStr.slice(0, i));
          const vs = koToNum(numStr.slice(i));
          const idx = tryVerseKey(bookResult, ch, vs);
          if (idx !== -1) { showVerse(idx, bookResult, ch, vs); return; }
        }
      }
    }

    setStatus('"' + text + '" 구절을 찾지 못했습니다. 예) 갈 5장 1절 / 갈5:1 / 갈오일', 'error');
  }

  function showVerse(idx, bookResult, ch, vs) {
    currentStart = idx;
    renderVerses(idx, false);
    const label = ABBREV_TO_FULL[bookResult.abbrev] || bookResult.matched;
    setStatus(label + ' ' + ch + '장 ' + vs + '절부터 표시합니다.', 'success');
  }

  async function searchBible(text) {
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }

    const geminiKey = localStorage.getItem('geminiKey');
    if (geminiKey) {
      setStatus('AI 분석 중...⏳');
      const result = await searchWithGemini(text);
      if (result === null) return; // 오류 발생 - 이미 에러 메시지 표시됨
      if (result.book && result.chapter && result.verse) {
        const bookResult = { abbrev: result.book, matched: result.book };
        const idx = tryVerseKey(bookResult, result.chapter, result.verse);
        if (idx !== -1) { showVerse(idx, bookResult, result.chapter, result.verse); return; }
      }
      if (result.keywords && result.keywords.length > 0) {
        searchKeyword(result.keywords, true);
        return;
      }
    }
    const words = text.trim().split(/\s+/).filter(w => w.length > 0);
    searchKeyword(words, false);
  }

  async function searchVerse(text) {
    // 음성 입력용: 구절 형식이면 이동, 아니면 검색
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    text = convertKoreanNumbers(text);
    const hasVerseRef = /\d+\s*[장편]/.test(text) && /\d+\s*절/.test(text);
    if (hasVerseRef) { goToVerse(text); } else { searchBible(text); }
  }


  function renderVerses(startIdx, append) {
    const container = document.getElementById('versesContainer');
    if (!append) {
      container.innerHTML = '';
      container.scrollTop = 0;
    }

    const end = Math.min(startIdx + PAGE_SIZE, bibleKeys.length);
    let lastChapterKey = null;

    for (let i = startIdx; i < end; i++) {
      const key = bibleKeys[i];
      const text = bibleData[key];
      const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) continue;
      const [, abbr, ch, vs] = m;
      const ck = abbr + ch;

      if (ck !== lastChapterKey) {
        const hdr = document.createElement('div');
        hdr.className = 'chapter-header';
        hdr.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장';
        container.appendChild(hdr);
        lastChapterKey = ck;
      }

      const div = document.createElement('div');
      div.className = 'verse-block' + (i === currentStart && !append ? ' highlight' : '');

      const copyBtn = makeCopyBtn(key, text);
      div.appendChild(copyBtn);

      const num = document.createElement('span');
      num.className = 'verse-num';
      num.textContent = vs;

      div.appendChild(num);
      div.appendChild(document.createTextNode(text));
      container.appendChild(div);
    }

    nextStart = end;
    document.getElementById('loadMoreBtn').style.display = end < bibleKeys.length ? 'block' : 'none';
  }

  function loadMore() {
    renderVerses(nextStart, true);
    document.getElementById('versesContainer').scrollBy({ top: 100, behavior: 'smooth' });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
  }
</script>
