<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>성경 음성 검색</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="성경">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { touch-action: pan-y; }

    html {
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior-x: none;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      text-align: center;
      position: relative;
      max-height: 80px;
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
    }
    header h1 {
      font-size: 1.2rem;
      color: #f0a500;
      letter-spacing: 0.05em;
    }
    #settingsBtn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.6;
    }
    .settings-panel {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .settings-panel.open { display: flex; }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-label {
      font-size: 0.8rem;
      color: #8b949e;
      width: 72px;
      flex-shrink: 0;
    }
    .settings-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 0.85rem;
      padding: 8px 12px;
      outline: none;
    }
    .settings-input:focus { border-color: #f0a500; }
    .settings-save-btn {
      background: #238636;
      border: none;
      color: white;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .settings-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .settings-adj-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .settings-adj-btn:active { background: #30363d; }
    .settings-val {
      min-width: 46px;
      text-align: center;
      font-size: 0.88rem;
      color: #f0a500;
      font-weight: bold;
    }
    .settings-ver {
      font-size: 0.7rem;
      color: #484f58;
      text-align: center;
    }
    .ai-badge {
      display: inline-block;
      background: #8957e5;
      color: white;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .search-bar {
      padding: 8px 12px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    #textInput {
      flex: 1;
      min-width: 0;
      max-width: 2000px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 1rem;
      padding: 8px 12px;
      outline: none;
      transition: max-width 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
    }

    #textInput:focus { border-color: #f0a500; }
    #textInput::placeholder { color: #484f58; }

    .mic-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #micVerseBtn   { background: #1f6feb; }
    #micKeywordBtn { background: #238636; }
    #micAiBtn      { background: #7c3aed; }
    .mic-btn.listening {
      background: #e05c5c !important;
      animation: pulse 1s infinite;
    }

    .status-bar {
      padding: 8px 16px;
      font-size: 0.82rem;
      color: #8b949e;
      background: #0d1117;
      min-height: 30px;
      text-align: center;
      max-height: 60px;
      overflow: hidden;
      transition: max-height 0.2s ease, padding 0.2s ease, min-height 0.2s ease;
    }

    .status-bar.error { color: #f85149; }
    .status-bar.success { color: #3fb950; }

    /* ── 읽기 모드 (스크롤 내렸을 때) ── */
    body.reading-mode header {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }
    body.reading-mode .settings-panel {
      display: none !important;
    }
    body.reading-mode #textInput {
      max-width: 0;
      opacity: 0;
      padding-left: 0;
      padding-right: 0;
    }
    body.reading-mode .status-bar {
      max-height: 0;
      padding: 0;
      min-height: 0;
    }

    .verses-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 0 0 80px 0;
    }

    .chapter-header {
      position: sticky;
      top: 0;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #f0a500;
      z-index: 10;
    }

    :root {
      --bible-fs: 1rem;
      --bible-vg: 10px;
      --bible-lh: 1.85;
    }

    .verse-block {
      padding: var(--bible-vg) 16px;
      line-height: var(--bible-lh);
      font-size: var(--bible-fs);
      border-bottom: 1px solid #1c2128;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .verse-block:active { background: rgba(255,255,255,0.04); }

    .verse-block.highlight {
      background: rgba(240, 165, 0, 0.08);
      border-left: 3px solid #f0a500;
    }

    .verse-block.selected {
      background: rgba(31, 111, 235, 0.12);
      border-left: 3px solid #1f6feb;
    }
    .verse-block.selected.highlight {
      background: rgba(31, 111, 235, 0.16);
    }

    .verse-num {
      color: #f0a500;
      font-size: 0.78rem;
      font-weight: bold;
      margin-right: 6px;
      vertical-align: top;
      line-height: 2;
    }

    #loadMoreBtn {
      display: block;
      padding: 10px 32px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 20px;
      font-size: 0.95rem;
      cursor: pointer;
      margin: 20px auto;
    }

    #loadMoreBtn:active { background: #30363d; }

    .back-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: #21262d;
      border: none;
      border-bottom: 1px solid #30363d;
      color: #f0a500;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
    }
    .back-btn:active { background: #30363d; }

    .load-prev-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #161b22;
      border: none;
      border-bottom: 1px solid #30363d;
      color: #8b949e;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .load-prev-btn:active { background: #21262d; }

    .goto-btn {
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
      margin-right: 4px;
    }
    .goto-btn:active { background: #388bfd; }

    .acc-item {
      border-bottom: 1px solid #30363d;
    }
    .acc-header {
      width: 100%;
      background: #161b22;
      border: none;
      color: #c9d1d9;
      font-size: 1rem;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .acc-header:active { background: #21262d; }
    .acc-arrow { color: #8b949e; font-size: 0.85rem; }
    .acc-body { background: #0d1117; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #484f58;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.95rem; line-height: 1.7; }
    .empty-state small { font-size: 0.82rem; color: #30363d; }

    .verse-ref {
      font-size: 0.78rem;
      color: #f0a500;
      font-weight: bold;
      display: block;
      margin-bottom: 3px;
    }

    .copy-btn {
      float: right;
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 8px;
      line-height: 1.6;
    }
    .copy-btn:active { background: #30363d; }
    .copy-btn.copied { color: #3fb950; border-color: #3fb950; }

    mark {
      background: rgba(240, 165, 0, 0.3);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    .copy-bar {
      display: none;
      padding: 8px 16px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      font-size: 0.82rem;
      color: #8b949e;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .copy-bar.visible { display: flex; }
    .copy-bar-btns { display: flex; gap: 8px; }
    .copy-bar button {
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    #clearBtn { background: #21262d; color: #8b949e; }
    #copyBtn  { background: #1f6feb; color: white; font-weight: 600; }

    .result-count {
      padding: 6px 16px;
      font-size: 0.8rem;
      color: #8b949e;
      background: #0d1117;
      border-bottom: 1px solid #1c2128;
    }

    .chapter-nav {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      z-index: 10;
      gap: 6px;
    }
    .chapter-nav-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chapter-nav-btn:active { background: #30363d; color: #c9d1d9; }
    .chapter-nav-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #f0a500;
      text-align: center;
      flex: 1;
    }
  </style>
</head>
<body>

<header>
  <h1>📖 성경 음성 검색 (개역개정)</h1>
  <button id="settingsBtn" onclick="toggleSettings()" title="설정">⚙️</button>
</header>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-row">
    <span class="settings-label">API 키</span>
    <input id="apiKeyInput" class="settings-input" type="password" placeholder="Gemini API 키 (자연어 검색용)">
    <button class="settings-save-btn" onclick="saveApiKey()">저장</button>
  </div>
  <div class="settings-row">
    <span class="settings-label">글자 크기</span>
    <div class="settings-ctrl">
      <button class="settings-adj-btn" onclick="adjustSetting('fs',-1)">−</button>
      <span class="settings-val" id="valFs">1.0</span>
      <button class="settings-adj-btn" onclick="adjustSetting('fs',1)">+</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">절 간격</span>
    <div class="settings-ctrl">
      <button class="settings-adj-btn" onclick="adjustSetting('vg',-1)">−</button>
      <span class="settings-val" id="valVg">10</span>
      <button class="settings-adj-btn" onclick="adjustSetting('vg',1)">+</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">줄 간격</span>
    <div class="settings-ctrl">
      <button class="settings-adj-btn" onclick="adjustSetting('lh',-1)">−</button>
      <span class="settings-val" id="valLh">1.85</span>
      <button class="settings-adj-btn" onclick="adjustSetting('lh',1)">+</button>
    </div>
  </div>
  <div class="settings-ver">AI 모델: gemini-2.5-flash-lite &nbsp;|&nbsp; 앱 버전: v4.5</div>
</div>

<div class="search-bar">
  <input id="textInput" type="text" placeholder="갈5:1 / 갈오장일절 / 믿음 소망 사랑" onkeydown="if(event.key==='Enter')goToVerse()">
  <div class="mic-group">
    <button class="mic-btn" id="micVerseBtn" onclick="toggleListening('verse')" title="구절 이동">🎤</button>
    <button class="mic-btn" id="micKeywordBtn" onclick="toggleListening('keyword')" title="키워드 검색">🎤</button>
    <button class="mic-btn" id="micAiBtn" onclick="toggleListening('ai')" title="AI 검색">🎤</button>
  </div>
</div>

<div class="copy-bar" id="copyBar">
  <span id="copyCount">0절 선택됨</span>
  <div class="copy-bar-btns">
    <button id="clearBtn" onclick="clearCopied()">해제</button>
    <button id="copyBtn" onclick="copySelected()">복사</button>
  </div>
</div>
<div class="status-bar" id="statusBar">성경 데이터 불러오는 중...</div>

<div class="verses-container" id="versesContainer">
  <div class="empty-state">
    <div class="icon">🎙️</div>
    <p>마이크 버튼을 누르고<br>읽고 싶은 구절을 말씀해주세요</p>
    <br>
    <small>예) "갈라디아서 5장 1절"<br>"시편 23편 1절"<br>"요한복음 3장 16절"</small>
  </div>
</div>


<script>
  const BOOK_MAP = {
    // 구약
    '창세기':'창','출애굽기':'출','레위기':'레','민수기':'민','신명기':'신',
    '여호수아':'수','사사기':'삿','룻기':'룻',
    '사무엘상':'삼상','사무엘하':'삼하',
    '열왕기상':'왕상','열왕기하':'왕하',
    '역대상':'대상','역대하':'대하',
    '에스라':'스','느헤미야':'느','에스더':'에',
    '욥기':'욥','시편':'시','잠언':'잠','전도서':'전','아가':'아',
    '이사야':'사','예레미야':'렘','예레미야애가':'애','에스겔':'겔','다니엘':'단',
    '호세아':'호','요엘':'욜','아모스':'암','오바댜':'옵','요나':'욘',
    '미가':'미','나훔':'나','하박국':'합','스바냐':'습','학개':'학',
    '스가랴':'슥','말라기':'말',
    // 신약
    '마태복음':'마','마가복음':'막','누가복음':'눅','요한복음':'요',
    '사도행전':'행','로마서':'롬',
    '고린도전서':'고전','고린도후서':'고후',
    '갈라디아서':'갈','에베소서':'엡','빌립보서':'빌','골로새서':'골',
    '데살로니가전서':'살전','데살로니가후서':'살후',
    '디모데전서':'딤전','디모데후서':'딤후',
    '디도서':'딛','빌레몬서':'몬','히브리서':'히','야고보서':'약',
    '베드로전서':'벧전','베드로후서':'벧후',
    '요한일서':'요일','요한이서':'요이','요한삼서':'요삼',
    '유다서':'유','요한계시록':'계','계시록':'계',
    // 약어
    '창':'창','출':'출','레':'레','민':'민','신':'신',
    '수':'수','삿':'삿','룻':'룻',
    '삼상':'삼상','삼하':'삼하',
    '왕상':'왕상','왕하':'왕하',
    '대상':'대상','대하':'대하',
    '스':'스','느':'느','에':'에',
    '욥':'욥','시':'시','잠':'잠','전':'전','아':'아',
    '사':'사','렘':'렘','애':'애','겔':'겔','단':'단',
    '호':'호','욜':'욜','암':'암','옵':'옵','욘':'욘',
    '미':'미','나':'나','합':'합','습':'습','학':'학',
    '슥':'슥','말':'말',
    '마':'마','막':'막','눅':'눅','요':'요',
    '행':'행','롬':'롬',
    '고전':'고전','고후':'고후',
    '갈':'갈','엡':'엡','빌':'빌','골':'골',
    '살전':'살전','살후':'살후',
    '딤전':'딤전','딤후':'딤후',
    '딛':'딛','몬':'몬','히':'히','약':'약',
    '벧전':'벧전','벧후':'벧후',
    '요일':'요일','요이':'요이','요삼':'요삼',
    '유':'유','계':'계',
    // 발음 유사 별칭
    '갈라지아서':'갈','갈라디야서':'갈',
    '필립보서':'빌','필립포서':'빌',
    '필레몬서':'몬','빌레몬':'몬',
    '골로세서':'골','골로쌔서':'골',
    '데살로니까전서':'살전','데살로니까후서':'살후',
    '데살로니카전서':'살전','데살로니카후서':'살후',
    '디모데이전서':'딤전','디모데이후서':'딤후',
    '에스켈':'겔','이스겔':'겔',
    '오바다':'옵','오바디아':'옵',
    '하바국':'합','하박꾹':'합',
    '스바니야':'습',
    '히부리서':'히','히브루서':'히',
    '야고버서':'약',
    '베드로일서':'벧전','베드로이서':'벧후',
    '요한계시':'계','계시록':'계',
    '사무엘일서':'삼상','사무엘이서':'삼하',
    '열왕기일서':'왕상','열왕기이서':'왕하',
    '역대기상':'대상','역대기하':'대하',
    '여호수와':'수','여호수아기':'수',
    '이사이야':'사','이사야서':'사',
    '예레미아':'렘','예레미야서':'렘',
    '호쎄아':'호','아모쓰':'암'
  };

  const ABBREV_TO_FULL = {};
  Object.entries(BOOK_MAP).forEach(([full, abbr]) => {
    if (!ABBREV_TO_FULL[abbr]) ABBREV_TO_FULL[abbr] = full;
  });

  let bibleData = {};
  let bibleKeys = [];
  let currentStart = 0;
  let nextStart = 0;
  let topStart = 0;
  let savedResults = null;
  const PAGE_SIZE = 40;

  let isListening = false;
  let recognition = null;
  let micReady = false;
  let selectedKeys = new Set();

  // ── Display settings ──
  const SETTINGS_CFG = {
    fs: { min: 0.8, max: 1.6, step: 0.05, prop: '--bible-fs', valId: 'valFs', unit: 'rem', fmt: v => v.toFixed(1) },
    vg: { min: 4,   max: 24,  step: 2,    prop: '--bible-vg', valId: 'valVg', unit: 'px',  fmt: v => String(Math.round(v)) },
    lh: { min: 1.3, max: 2.6, step: 0.1,  prop: '--bible-lh', valId: 'valLh', unit: '',    fmt: v => v.toFixed(2) }
  };
  const settings = {
    fs: parseFloat(localStorage.getItem('bibleFs') || '1.0'),
    vg: parseFloat(localStorage.getItem('bibleVg') || '10'),
    lh: parseFloat(localStorage.getItem('bibleLh') || '1.85')
  };

  function applySettings() {
    const root = document.documentElement;
    root.style.setProperty('--bible-fs', settings.fs + 'rem');
    root.style.setProperty('--bible-vg', settings.vg + 'px');
    root.style.setProperty('--bible-lh', settings.lh);
    Object.entries(SETTINGS_CFG).forEach(([k, cfg]) => {
      const el = document.getElementById(cfg.valId);
      if (el) el.textContent = cfg.fmt(settings[k]);
    });
  }

  function adjustSetting(key, dir) {
    const cfg = SETTINGS_CFG[key];
    let val = Math.round((settings[key] + dir * cfg.step) * 1000) / 1000;
    val = Math.max(cfg.min, Math.min(cfg.max, val));
    settings[key] = val;
    localStorage.setItem('bible' + key[0].toUpperCase() + key.slice(1), val);
    applySettings();
  }

  applySettings();

  // ── Navigation history ──
  let historyStack = [];
  let currentViewState = null;

  function pushViewHistory() {
    if (!currentViewState) return;
    historyStack.push(currentViewState);
    history.pushState({ bibleDepth: historyStack.length }, '');
  }

  function restoreView(state) {
    currentViewState = null;
    if (state.type === 'chapter') {
      showChapter(state.abbr, state.ch, state.highlightIdx, false);
    } else if (state.type === 'keyword') {
      searchKeyword(state.words, state.isAI, false);
    } else if (state.type === 'snapshot') {
      const container = document.getElementById('versesContainer');
      container.innerHTML = state.html;
      container.scrollTop = state.scrollTop;
      setStatus(state.statusText, state.statusText ? 'success' : '');
      currentViewState = state;
    }
  }

  window.addEventListener('popstate', () => {
    if (historyStack.length > 0) {
      const prev = historyStack.pop();
      restoreView(prev);
      if (historyStack.length > 0) {
        history.pushState({ bibleDepth: historyStack.length }, '');
      }
    }
  });

  function updateCopyBar() {
    const bar = document.getElementById('copyBar');
    const count = document.getElementById('copyCount');
    if (selectedKeys.size === 0) {
      bar.classList.remove('visible');
    } else {
      bar.classList.add('visible');
      count.textContent = selectedKeys.size + '절 선택됨';
    }
  }

  function toggleVerse(key, el) {
    if (selectedKeys.has(key)) {
      selectedKeys.delete(key);
      el.classList.remove('selected');
    } else {
      selectedKeys.add(key);
      el.classList.add('selected');
    }
    updateCopyBar();
  }

  function clearCopied() {
    selectedKeys.clear();
    document.querySelectorAll('.verse-block.selected').forEach(el => el.classList.remove('selected'));
    updateCopyBar();
  }

  function copySelected() {
    if (selectedKeys.size === 0) return;
    const sorted = bibleKeys.filter(k => selectedKeys.has(k));
    const text = sorted.map(k => {
      const m = k.match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) return '';
      const [, abbr, ch, vs] = m;
      return (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장 ' + vs + '절\n' + bibleData[k].trim();
    }).join('\n\n');
    navigator.clipboard.writeText(text);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ 완료';
    setTimeout(() => { btn.textContent = '복사'; }, 1500);
  }

  // Pre-request mic permission so Chrome doesn't ask every time
  function ensureMicPermission(callback) {
    if (micReady) { callback(); return; }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
        micReady = true;
        callback();
      })
      .catch(() => {
        setStatus('마이크 권한이 거부됐습니다. 브라우저 설정에서 허용해주세요.', 'error');
      });
  }

  // Load bible.json
  fetch('bible.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => {
      bibleData = data;
      bibleKeys = Object.keys(data);
      setStatus('준비됐습니다. 음성 또는 텍스트로 구절을 검색하세요.', '');
    })
    .catch(() => setStatus('bible.json을 불러오지 못했습니다.', 'error'));

  function setStatus(msg, type = '') {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'status-bar' + (type ? ' ' + type : '');
  }

  let listenMode = 'verse';

  function toggleListening(mode) {
    if (isListening) { recognition && recognition.stop(); return; }
    listenMode = mode;
    const existing = document.getElementById('textInput').value.trim();
    if (existing) {
      document.getElementById('textInput').value = '';
      if (mode === 'verse') goToVerse(existing);
      else if (mode === 'keyword') searchKeywordDirect(existing);
      else searchAI(existing);
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.', 'error'); return; }
    ensureMicPermission(startRecognition);
  }

  function activeMicBtn() {
    if (listenMode === 'verse') return document.getElementById('micVerseBtn');
    if (listenMode === 'keyword') return document.getElementById('micKeywordBtn');
    return document.getElementById('micAiBtn');
  }

  function startRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      activeMicBtn().classList.add('listening');
      activeMicBtn().textContent = '⏹';
      const modeMsg = listenMode === 'verse' ? '구절을 말씀해주세요' : listenMode === 'keyword' ? '검색어를 말씀해주세요' : 'AI 검색어를 말씀해주세요';
      setStatus('듣고 있습니다... ' + modeMsg);
    };

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      document.getElementById('textInput').value = transcript;
      if (e.results[e.results.length - 1].isFinal) {
        if (listenMode === 'verse') goToVerse(transcript);
        else if (listenMode === 'keyword') searchKeywordDirect(transcript);
        else searchAI(transcript);
      }
    };

    recognition.onend = () => {
      isListening = false;
      activeMicBtn().classList.remove('listening');
      activeMicBtn().textContent = '🎤';
    };

    recognition.onerror = (e) => {
      isListening = false;
      activeMicBtn().classList.remove('listening');
      activeMicBtn().textContent = '🎤';
      setStatus('음성 인식 오류: ' + e.error, 'error');
    };

    recognition.start();
  }

  function levenshtein(a, b) {
    const dp = Array.from({length: a.length + 1}, (_, i) =>
      Array.from({length: b.length + 1}, (_, j) => i === 0 ? j : j === 0 ? i : 0)
    );
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[a.length][b.length];
  }

  function findBook(text) {
    const books = Object.keys(BOOK_MAP).sort((a, b) => b.length - a.length);

    // 0차: 첫 단어가 BOOK_MAP에 있으면 바로 반환 (한 글자 약어 포함)
    const firstWord = text.match(/^([가-힣]+)/);
    if (firstWord && BOOK_MAP[firstWord[1]]) {
      return { abbrev: BOOK_MAP[firstWord[1]], matched: firstWord[1], fuzzy: false };
    }

    // 1차: 완전 포함 매칭
    for (const book of books) {
      if (text.includes(book)) return { abbrev: BOOK_MAP[book], matched: book, fuzzy: false };
    }

    // 2차: 숫자·장·절 제거 후 남은 텍스트로 유사도 비교
    const stripped = text.replace(/\d+\s*[장편절]/g, '').replace(/\s+/g, '').trim();
    if (!stripped) return null;

    let best = null, bestDist = Infinity;
    for (const book of books) {
      // 앞부분 부분 비교 (긴 책 이름은 앞 글자만 말해도 매칭)
      const sub = book.slice(0, stripped.length);
      const dist = Math.min(levenshtein(stripped, book), levenshtein(stripped, sub));
      if (dist < bestDist) { bestDist = dist; best = book; }
    }

    // 거리 허용 범위: 입력 길이의 40% 이하
    const threshold = Math.max(1, Math.floor(stripped.length * 0.4));
    if (bestDist <= threshold) return { abbrev: BOOK_MAP[best], matched: best, fuzzy: true };
    return null;
  }

  const KO_SUFFIXES = [
    '에서부터','으로부터','에게서','으로서','로부터','한테서',
    '에서','에게','한테','으로','로서','부터','까지','마다','조차',
    '이라도','이나마','와의','과의','이랑','랑','이라','라',
    '에도','의','와','과','에','도','만','은','는','이','가','을','를',
    '하시니라','하시니','하셨다','하였다','하였으며','하였고','하였으니',
    '하는','하고','하여','하며','하지','하면','하니','하다','하여서',
    '되시는','되는','되고','되며','됩니다','되었','됐','된',
    '있는','없는','있고','없고','이시는','이신','하신','하실',
    '스럽','다운','스러운','이다','이고','이며','인데','이면',
    '는다','는지','인지','시니라','니라'
  ];

  function koreanStem(word) {
    for (const s of KO_SUFFIXES) {
      if (word.endsWith(s) && word.length - s.length >= 1) {
        return word.slice(0, word.length - s.length);
      }
    }
    return word;
  }

  function highlightWords(text, words) {
    let result = text;
    words.forEach(w => {
      if (!w) return;
      result = result.split(w).join('<mark>' + w + '</mark>');
    });
    return result;
  }

  function applyVerseOnclick(el, key) {
    el.onclick = (e) => {
      if (e.target.closest('button')) return;
      toggleVerse(key, el);
    };
    if (selectedKeys.has(key)) el.classList.add('selected');
  }

  function searchKeyword(words, isAI = false, addToHistory = true) {
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }
    if (addToHistory) pushViewHistory();
    setStatus('검색 중...');

    setTimeout(() => {
      // 조사/어미 제거 후 빈 문자열 제거
      const stems = words.map(koreanStem).filter(w => w.length >= 1);
      if (!stems.length) { setStatus('검색어를 인식하지 못했습니다.', 'error'); return; }

      const results = bibleKeys.filter(key =>
        stems.every(w => bibleData[key].includes(w))
      );

      if (!results.length) {
        setStatus('"' + stems.join(' ') + '" 포함된 구절이 없습니다.', 'error');
        document.getElementById('versesContainer').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>검색 결과가 없습니다</p></div>';
        return;
      }

      const container = document.getElementById('versesContainer');
      container.innerHTML = '';
      container.scrollTop = 0;

      const countDiv = document.createElement('div');
      countDiv.className = 'result-count';
      countDiv.textContent = results.length + '개 구절 발견';
      container.appendChild(countDiv);

      results.forEach(key => {
        const verseText = bibleData[key];
        const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
        if (!m) return;
        const [, abbr, ch, vs] = m;

        const div = document.createElement('div');
        div.className = 'verse-block';
        applyVerseOnclick(div, key);

        const gotoBtn = document.createElement('button');
        gotoBtn.className = 'goto-btn';
        gotoBtn.textContent = '이동';
        gotoBtn.onclick = () => {
          const idx = bibleKeys.indexOf(key);
          const bookResult = findBook(abbr) || { abbrev: abbr, matched: abbr };
          showVerse(idx, bookResult, ch, vs);
        };
        div.appendChild(gotoBtn);

        const ref = document.createElement('span');
        ref.className = 'verse-ref';
        ref.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장 ' + vs + '절';
        div.appendChild(ref);

        const content = document.createElement('span');
        content.innerHTML = highlightWords(verseText, stems);
        div.appendChild(content);

        container.appendChild(div);
      });

      const badge = isAI ? ' <span class="ai-badge">AI</span>' : '';
      setStatus(results.length + '개 구절을 찾았습니다.' + badge, 'success');
      currentViewState = { type: 'keyword', words: [...words], isAI };
    }, 10);
  }

  function koToNum(s) {
    if (/^\d+$/.test(s)) return parseInt(s);
    const koNum = { '일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9 };
    let n = 0;
    if (s.includes('백')) {
      const i = s.indexOf('백');
      n += (koNum[s.slice(0, i)] || 1) * 100;
      s = s.slice(i + 1);
    }
    if (s.includes('십')) {
      const i = s.indexOf('십');
      const t = s.slice(0, i);
      n += (t ? (koNum[t] || 1) : 1) * 10;
      s = s.slice(i + 1);
    }
    if (s && koNum[s] !== undefined) n += koNum[s];
    return n || 0;
  }

  function convertKoreanNumbers(text) {
    const hasJang = /[일이삼사오육칠팔구백십\d]+\s*[장편]/.test(text);
    const hasJeol = /[일이삼사오육칠팔구백십\d]+\s*절/.test(text);
    if (!hasJang || !hasJeol) return text;

    return text.replace(/([일이삼사오육칠팔구백십]+)\s*([장편절])/g, (match, num, suffix) => {
      const n = koToNum(num);
      return n > 0 ? n + suffix : match;
    });
  }

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      const saved = localStorage.getItem('geminiKey') || '';
      document.getElementById('apiKeyInput').value = saved ? '●'.repeat(8) : '';
      applySettings();
    }
  }

  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val && !val.startsWith('●')) {
      localStorage.setItem('geminiKey', val);
    }
    document.getElementById('settingsPanel').classList.remove('open');
    const has = !!localStorage.getItem('geminiKey');
    setStatus(has ? 'API 키 저장됨. 자연어 검색 사용 가능!' : 'API 키가 없습니다.', has ? 'success' : '');
  }

  async function searchWithGemini(query) {
    const key = localStorage.getItem('geminiKey');
    if (!key) return null;
    const prompt = `성경 전문가로서 검색어를 분석해 JSON만 반환해. 마크다운 없이 순수 JSON만.

검색어: "${query}"

- 특정 사건/비유/인물이면 results에 성경 위치 목록 (여러 곳이면 모두):
  {"keywords":[],"results":[{"book":"마","chapter":14,"verse":13},{"book":"막","chapter":6,"verse":30}]}
- 키워드 검색이면 keywords에 핵심 명사만 (조사 제거):
  {"keywords":["믿음","소망"],"results":[]}

book은 한글 약어만: 창 출 레 민 신 수 삿 룻 삼상 삼하 왕상 왕하 대상 대하 스 느 에 욥 시 잠 전 아 사 렘 애 겔 단 호 욜 암 옵 욘 미 나 합 습 학 슥 말 마 막 눅 요 행 롬 고전 고후 갈 엡 빌 골 살전 살후 딤전 딤후 딛 몬 히 약 벧전 벧후 요일 요이 요삼 유 계`;
    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${key}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { response_mime_type: 'application/json' }
          })
        }
      );
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (err.error?.code === 429) setStatus('API 한도 초과. 잠시 후 다시 시도하세요.', 'error');
        else setStatus('Gemini 오류: ' + (err.error?.message || res.status), 'error');
        return null;
      }
      const data = await res.json();
      const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      return JSON.parse(txt);
    } catch (e) {
      setStatus('네트워크 오류 또는 API 키를 확인하세요.', 'error');
      return null;
    }
  }

  function tryVerseKey(bookResult, ch, vs) {
    if (!bookResult || ch <= 0 || vs <= 0) return -1;
    return bibleKeys.indexOf(bookResult.abbrev + ch + ':' + vs);
  }

  function goToVerse(text) {
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }

    text = convertKoreanNumbers(text);

    // 1. 장/절 형식: "갈 5장 1절" / 장만 있으면 1절 기본값
    const hasJang = /[일이삼사오육칠팔구백십\d]+\s*[장편]/.test(text);
    if (hasJang) {
      text = text.replace(/([일이삼사오육칠팔구백십]+)\s*([장편절])/g, (m, num, suf) => {
        const n = koToNum(num); return n > 0 ? n + suf : m;
      });
      const bookResult = findBook(text);
      if (bookResult) {
        const chM = text.match(/(\d+)\s*[장편]/);
        const vsM = text.match(/(\d+)\s*절/);
        if (chM) {
          const vs = vsM ? parseInt(vsM[1]) : 1;
          const idx = tryVerseKey(bookResult, parseInt(chM[1]), vs);
          if (idx !== -1) { showVerse(idx, bookResult, chM[1], vs); return; }
        }
      }
    }

    // 2. 단축 형식: "갈 5 1" / "갈5:1" / "갈 오 일"
    const koN = '[일이삼사오육칠팔구백십\\d]+';
    const shortRef = text.match(new RegExp('^([가-힣]+)\\s*(' + koN + ')[:\\s]\\s*(' + koN + ')$'));
    if (shortRef) {
      const bookResult = findBook(shortRef[1]);
      const ch = koToNum(shortRef[2]), vs = koToNum(shortRef[3]);
      const idx = tryVerseKey(bookResult, ch, vs);
      if (idx !== -1) { showVerse(idx, bookResult, ch, vs); return; }
    }

    // 3. 붙여쓰기: "창일일" / "갈오일"
    const koNums = '일이삼사오육칠팔구십백';
    const stuck = text.match(new RegExp('^([가-힣]+?)\\s*([' + koNums + '\\d]+)$'));
    if (stuck && /[일이삼사오육칠팔구십백]/.test(stuck[2])) {
      const bookResult = findBook(stuck[1]);
      if (bookResult) {
        const numStr = stuck[2];
        for (let i = numStr.length - 1; i >= 1; i--) {
          const ch = koToNum(numStr.slice(0, i));
          const vs = koToNum(numStr.slice(i));
          const idx = tryVerseKey(bookResult, ch, vs);
          if (idx !== -1) { showVerse(idx, bookResult, ch, vs); return; }
        }
      }
    }

    setStatus('"' + text + '" 구절을 찾지 못했습니다. 예) 갈 5장 1절 / 갈5:1 / 갈오일', 'error');
  }

  function showVerse(idx, bookResult, ch, vs) {
    currentStart = idx;
    const keyM = bibleKeys[idx].match(/^([가-힣]+)(\d+):(\d+)$/);
    const abbr = keyM ? keyM[1] : bookResult.abbrev;
    showChapter(abbr, String(ch), idx);
    document.getElementById('textInput').value = '';
  }

  function showChapter(abbr, ch, highlightIdx, addToHistory = true) {
    if (addToHistory) pushViewHistory();
    const chStr = String(ch);
    let chStart = -1, chEnd = -1;
    for (let i = 0; i < bibleKeys.length; i++) {
      const m = bibleKeys[i].match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) continue;
      if (m[1] === abbr && m[2] === chStr) {
        if (chStart === -1) chStart = i;
        chEnd = i;
      } else if (chStart !== -1) break;
    }
    if (chStart === -1) return;

    const container = document.getElementById('versesContainer');
    container.innerHTML = '';
    container.scrollTop = 0;

    // ── 이전 / 다음 장 네비게이션 ──
    const nav = document.createElement('div');
    nav.className = 'chapter-nav';

    if (chStart > 0) {
      const pk = bibleKeys[chStart - 1].match(/^([가-힣]+)(\d+):(\d+)$/);
      if (pk) {
        const prevBtn = document.createElement('button');
        prevBtn.className = 'chapter-nav-btn';
        prevBtn.textContent = '← 이전 장';
        prevBtn.onclick = () => showChapter(pk[1], pk[2], -1);
        nav.appendChild(prevBtn);
      }
    } else {
      nav.appendChild(document.createElement('span'));
    }

    const title = document.createElement('span');
    title.className = 'chapter-nav-title';
    title.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장';
    nav.appendChild(title);

    if (chEnd + 1 < bibleKeys.length) {
      const nk = bibleKeys[chEnd + 1].match(/^([가-힣]+)(\d+):(\d+)$/);
      if (nk) {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'chapter-nav-btn';
        nextBtn.textContent = '다음 장 →';
        nextBtn.onclick = () => showChapter(nk[1], nk[2], -1);
        nav.appendChild(nextBtn);
      }
    } else {
      nav.appendChild(document.createElement('span'));
    }

    container.appendChild(nav);

    // ── 구절 렌더링 ──
    let highlightEl = null;
    for (let i = chStart; i <= chEnd; i++) {
      const key = bibleKeys[i];
      const text = bibleData[key];
      const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) continue;
      const [, , , vs] = m;

      const div = document.createElement('div');
      div.className = 'verse-block' + (i === highlightIdx ? ' highlight' : '');
      applyVerseOnclick(div, key);

      const num = document.createElement('span');
      num.className = 'verse-num';
      num.textContent = vs;
      div.appendChild(num);
      div.appendChild(document.createTextNode(text));
      container.appendChild(div);

      if (i === highlightIdx) highlightEl = div;
    }

    if (highlightEl) {
      setTimeout(() => highlightEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
    }

    currentViewState = { type: 'chapter', abbr, ch: String(ch), highlightIdx };
    document.body.classList.remove('reading-mode');
    setStatus('');
  }

  function searchKeywordDirect(text) {
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }
    document.getElementById('textInput').value = '';
    const words = text.trim().split(/\s+/).filter(w => w.length > 0);
    searchKeyword(words, false);
  }

  async function searchAI(text) {
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    if (!bibleKeys.length) { setStatus('데이터 로딩 중입니다.', 'error'); return; }
    const geminiKey = localStorage.getItem('geminiKey');
    if (!geminiKey) { setStatus('⚙️를 눌러 Gemini API 키를 먼저 입력해주세요.', 'error'); return; }
    setStatus('AI 분석 중...⏳');
    const result = await searchWithGemini(text);
    if (result === null) return;
    // results 배열 또는 단일 book/chapter/verse 모두 처리
    const locs = result.results && result.results.length > 0
      ? result.results
      : (result.book && result.chapter && result.verse ? [result] : []);
    if (locs.length > 0) {
      // 유효한 위치만 필터링
      const valid = locs.map(r => {
        const bookResult = findBook(r.book) || { abbrev: r.book, matched: r.book };
        const idx = tryVerseKey(bookResult, r.chapter, r.verse);
        return idx !== -1 ? { bookResult, idx, chapter: r.chapter, verse: r.verse } : null;
      }).filter(Boolean);

      if (valid.length === 1) {
        // 결과 1개 → 바로 말씀 표시
        const { bookResult, idx, chapter, verse } = valid[0];
        showVerse(idx, bookResult, chapter, verse);
        return;
      }
      if (valid.length > 1) {
        // 결과 여러 개 → 아코디언 목록
        pushViewHistory();
        const container = document.getElementById('versesContainer');
        container.innerHTML = '';
        container.scrollTop = 0;
        valid.forEach(({ bookResult, idx, chapter, verse }) => {
          const label = ABBREV_TO_FULL[bookResult.abbrev] || bookResult.abbrev;
          const item = document.createElement('div');
          item.className = 'acc-item';

          const header = document.createElement('button');
          header.className = 'acc-header';
          header.innerHTML = `<span>${label} ${chapter}장 ${verse}절</span><span class="acc-arrow">▼</span>`;

          const body = document.createElement('div');
          body.className = 'acc-body';
          body.style.display = 'none';

          // 말씀 내용 렌더링 (20절)
          let lastCk = null;
          const end = Math.min(idx + 20, bibleKeys.length);
          for (let i = idx; i < end; i++) {
            const key = bibleKeys[i];
            const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
            if (!m) continue;
            const [, ab, ch, vs] = m;
            const ck = ab + ch;
            if (ck !== lastCk) {
              const hdr = document.createElement('div');
              hdr.className = 'chapter-header';
              hdr.textContent = (ABBREV_TO_FULL[ab] || ab) + ' ' + ch + '장';
              body.appendChild(hdr);
              lastCk = ck;
            }
            const div = document.createElement('div');
            div.className = 'verse-block';
            applyVerseOnclick(div, key);
            const num = document.createElement('span');
            num.className = 'verse-num';
            num.textContent = vs;
            div.appendChild(num);
            div.appendChild(document.createTextNode(bibleData[key]));
            body.appendChild(div);
          }

          header.onclick = () => {
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            header.querySelector('.acc-arrow').textContent = open ? '▼' : '▲';
          };

          item.appendChild(header);
          item.appendChild(body);
          container.appendChild(item);
        });
        const aiStatus = `AI 검색 결과 ${valid.length}곳`;
        setStatus(aiStatus, 'success');
        document.getElementById('textInput').value = '';
        currentViewState = { type: 'snapshot', html: container.innerHTML, scrollTop: 0, statusText: aiStatus };
        return;
      }
    }
    if (result.keywords && result.keywords.length > 0) {
      document.getElementById('textInput').value = '';
      searchKeyword(result.keywords, true);
      return;
    }
    setStatus('AI가 관련 구절을 찾지 못했습니다.', 'error');
  }

  async function searchBible(text) {
    searchKeywordDirect(text);
  }

  async function searchVerse(text) {
    // 음성 입력용: 구절 형식이면 이동, 아니면 검색
    text = text || document.getElementById('textInput').value.trim();
    if (!text) return;
    text = convertKoreanNumbers(text);
    const hasVerseRef = /\d+\s*[장편]/.test(text) && /\d+\s*절/.test(text);
    if (hasVerseRef) { goToVerse(text); } else { searchBible(text); }
  }


  function renderVerses(startIdx, append) {
    const container = document.getElementById('versesContainer');
    if (!append) {
      container.innerHTML = '';
      container.scrollTop = 0;
      topStart = startIdx;
      if (startIdx > 0) {
        const btn = document.createElement('button');
        btn.id = 'loadPrevBtn';
        btn.className = 'load-prev-btn';
        btn.textContent = '▲ 이전 구절';
        btn.onclick = loadPrev;
        container.appendChild(btn);
      }
    }

    const end = Math.min(startIdx + PAGE_SIZE, bibleKeys.length);
    let lastChapterKey = null;

    for (let i = startIdx; i < end; i++) {
      const key = bibleKeys[i];
      const text = bibleData[key];
      const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) continue;
      const [, abbr, ch, vs] = m;
      const ck = abbr + ch;

      if (ck !== lastChapterKey) {
        const hdr = document.createElement('div');
        hdr.className = 'chapter-header';
        hdr.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장';
        container.appendChild(hdr);
        lastChapterKey = ck;
      }

      const div = document.createElement('div');
      div.className = 'verse-block' + (i === currentStart && !append ? ' highlight' : '');
      applyVerseOnclick(div, key);

      const num = document.createElement('span');
      num.className = 'verse-num';
      num.textContent = vs;

      div.appendChild(num);
      div.appendChild(document.createTextNode(text));
      container.appendChild(div);
    }

    nextStart = end;
    const existingLoadMore = container.querySelector('#loadMoreBtn');
    if (existingLoadMore) existingLoadMore.remove();
    if (end < bibleKeys.length) {
      const loadBtn = document.createElement('button');
      loadBtn.id = 'loadMoreBtn';
      loadBtn.textContent = '▼ 더 보기';
      loadBtn.onclick = loadMore;
      container.appendChild(loadBtn);
    }
  }

  function loadMore() {
    renderVerses(nextStart, true);
    document.getElementById('versesContainer').scrollBy({ top: 100, behavior: 'smooth' });
  }

  function addBackButton() {
    const container = document.getElementById('versesContainer');
    const btn = document.createElement('button');
    btn.id = 'backBtn';
    btn.className = 'back-btn';
    btn.textContent = '← 검색 결과로';
    btn.onclick = goBack;
    container.insertBefore(btn, container.firstChild);
  }

  function goBack() {
    if (!savedResults) return;
    const container = document.getElementById('versesContainer');
    container.innerHTML = savedResults.html;
    container.scrollTop = savedResults.scrollTop;
    setStatus(savedResults.status, 'success');
    savedResults = null;
  }

  function loadPrev() {
    const PREV_SIZE = 20;
    const newStart = Math.max(0, topStart - PREV_SIZE);
    if (newStart >= topStart) return;
    const container = document.getElementById('versesContainer');
    const prevBtn = document.getElementById('loadPrevBtn');
    const frag = document.createDocumentFragment();
    let lastChapterKey = null;
    for (let i = newStart; i < topStart; i++) {
      const key = bibleKeys[i];
      const text = bibleData[key];
      const m = key.match(/^([가-힣]+)(\d+):(\d+)$/);
      if (!m) continue;
      const [, abbr, ch, vs] = m;
      const ck = abbr + ch;
      if (ck !== lastChapterKey) {
        const hdr = document.createElement('div');
        hdr.className = 'chapter-header';
        hdr.textContent = (ABBREV_TO_FULL[abbr] || abbr) + ' ' + ch + '장';
        frag.appendChild(hdr);
        lastChapterKey = ck;
      }
      const div = document.createElement('div');
      div.className = 'verse-block';
      applyVerseOnclick(div, key);
      const num = document.createElement('span');
      num.className = 'verse-num';
      num.textContent = vs;
      div.appendChild(num);
      div.appendChild(document.createTextNode(text));
      frag.appendChild(div);
    }
    const oldHeight = container.scrollHeight;
    container.insertBefore(frag, prevBtn ? prevBtn.nextSibling : container.firstChild);
    container.scrollTop += container.scrollHeight - oldHeight;
    topStart = newStart;
    if (topStart === 0) prevBtn?.remove();
  }

  // ── 읽기 모드: 스크롤하면 제목/입력창 숨김 ──
  document.getElementById('versesContainer').addEventListener('scroll', () => {
    const scrolled = document.getElementById('versesContainer').scrollTop > 80;
    if (scrolled) {
      document.body.classList.add('reading-mode');
      document.getElementById('settingsPanel').classList.remove('open');
    } else {
      document.body.classList.remove('reading-mode');
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
  }
</script>
